# The answer key of the own fixture (auditdesk-fixture, design § 11). It lives here, outside the
# fixture, so nothing in the fixture points at a defect. Line numbers refer to the commit pinned in
# evals/fixtures.yaml; each location's anchor is a text its first line holds.
#
# kind: finding (located), absence (nothing to point at) or question (what the code cannot show).
# Matching, for the grader of Phase 2:
# - a finding matches an entry when any of its evidence ranges overlaps the entry's location or one
#   of its `also` locations (with a slack of 3 lines), and its checklist item is the entry's or one
#   of `alsoItems` (items another aspect may own when the run leaves the entry's aspect out);
# - an absence matches a finding or a question under its item, in any file;
# - a question matches a question under its item, and counts towards recall like a finding;
# - known lists true issues that were not planted: a finding under a known item (and in its file,
#   when one is given) is neither a match nor a false finding.
fixture: own
