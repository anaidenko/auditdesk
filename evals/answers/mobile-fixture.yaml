# The answer key of the mobile fixture (auditdesk-mobile-fixture): two apps, each audited as a
# repository of its own (evals/fixtures.yaml, dirs), so every path starts with its folder. Line
# numbers refer to the commit pinned in evals/fixtures.yaml; each location's anchor is a text its
# first line holds. Matching follows the own fixture's key (own-fixture.yaml, its header).
fixture: mobile
