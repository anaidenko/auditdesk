# Juice Shop v20.2.0's coding challenges that mark a vulnerable line in TypeScript or JavaScript,
# each with the checklist item an auditor following Auditdesk's checklists would file it under.
# Written once from the marked code (2026-10-07); Andrii reviews it before the baseline run.
# The challenges marked only in Solidity, Terraform or YAML are outside v1's coverage.
challenges:
    accessLogDisclosureChallenge: { aspect: security, checklistItem: SEC-13, severity: medium, title: "Server access logs are served to anyone" }
    adminSectionChallenge: { aspect: security, checklistItem: SEC-03, severity: medium, title: "The admin section is guarded only by a client-side route" }
    changeProductChallenge: { aspect: security, checklistItem: SEC-03, severity: high, title: "Products can be changed without authorization" }
    chatbotGreedyInjectionChallenge: { aspect: llm, checklistItem: LLM-01, severity: medium, title: "The chatbot can be talked into handing out what it should not" }
    chatbotPromptInjectionChallenge: { aspect: llm, checklistItem: LLM-01, severity: high, title: "User input reaches the chatbot's instructions" }
    dbSchemaChallenge: { aspect: security, checklistItem: SEC-04, severity: critical, title: "SQL injection in product search exposes the schema" }
    directoryListingChallenge: { aspect: security, checklistItem: SEC-08, severity: medium, title: "A directory of files is listed and served to anyone" }
    exposedMetricsChallenge: { aspect: security, checklistItem: SEC-13, severity: low, title: "Application metrics are exposed without authentication" }
    forgedReviewChallenge: { aspect: security, checklistItem: SEC-03, severity: medium, title: "A review's author is taken from the request" }
    localXssChallenge: { aspect: security, checklistItem: SEC-05, severity: high, title: "Search input is rendered as trusted HTML" }
    loginAdminChallenge: { aspect: security, checklistItem: SEC-04, severity: critical, title: "SQL injection in the login query" }
    loginBenderChallenge: { aspect: security, checklistItem: SEC-04, severity: critical, title: "SQL injection in the login query" }
    loginJimChallenge: { aspect: security, checklistItem: SEC-04, severity: critical, title: "SQL injection in the login query" }
    noSqlReviewsChallenge: { aspect: security, checklistItem: SEC-04, severity: high, title: "NoSQL injection in the review update" }
    redirectChallenge: { aspect: security, checklistItem: SEC-15, severity: medium, title: "The redirect allowlist can be bypassed" }
    redirectCryptoCurrencyChallenge: { aspect: security, checklistItem: SEC-15, severity: low, title: "Outdated redirect targets stay in the allowlist" }
    registerAdminChallenge: { aspect: security, checklistItem: SEC-09, severity: critical, title: "Registration accepts a role from the request body" }
    resetPasswordMortyChallenge: { aspect: security, checklistItem: SEC-12, severity: medium, title: "The password reset's rate limit trusts a client header" }
    restfulXssChallenge: { aspect: security, checklistItem: SEC-05, severity: high, title: "Product descriptions are rendered as trusted HTML" }
    scoreBoardChallenge: { aspect: security, checklistItem: SEC-03, severity: info, title: "A hidden route is reachable by anyone who finds it" }
    tokenSaleChallenge: { aspect: security, checklistItem: SEC-03, severity: info, title: "A hidden route is reachable by anyone who finds it" }
    unionSqlInjectionChallenge: { aspect: security, checklistItem: SEC-04, severity: critical, title: "SQL injection in product search reads other tables" }
    weakPasswordChallenge: { aspect: security, checklistItem: SEC-01, severity: high, title: "Passwords are hashed with a fast, unsalted hash" }
    web3SandboxChallenge: { aspect: security, checklistItem: SEC-03, severity: info, title: "A hidden route is reachable by anyone who finds it" }
    xssBonusChallenge: { aspect: security, checklistItem: SEC-05, severity: high, title: "Search input is rendered as trusted HTML" }
