# Format, lint, types, unit and end-to-end tests on every push and pull request. The model and the
# scanners are replayed from recordings, so CI needs no API key and no scanner images (design § 13).
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: auditdesk
          POSTGRES_PASSWORD: auditdesk
          POSTGRES_DB: auditdesk
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U auditdesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # .env.test points at the service above.
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
