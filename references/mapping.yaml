# asvs: a section (V8.3) or a requirement (1.3.6) of ASVS 5.0.0, as listed in asvs-5.0.0.yaml.
# nist: NIST SP 800-63B-4, for authentication only.
# cheatsheets: names of OWASP Cheat Sheets, each from the list below.

