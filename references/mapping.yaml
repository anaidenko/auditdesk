# Each checklist item's references in the client's report (design § 10). The OWASP Top 10:2025
# category follows from the finding's own CWE when the agent names one, else from the item's cwe,
# else from the item's top10; only the finding's own CWE is printed as its weakness, and a question
# gets no category. An item's cwe is given only where one CWE describes the whole item, and never
# one MITRE prohibits for mapping. The report links, never quotes, and says "relevant to", never
# "compliant".
#
# asvs: a section (V8.3) or a requirement (1.3.6) of ASVS 5.0.0, as listed in asvs-5.0.0.yaml.
# nist: NIST SP 800-63B-4, for authentication only.
# cheatsheets: names of OWASP Cheat Sheets, each from the list below.

# Each answered HTTP 200 at cheatsheetseries.owasp.org/cheatsheets/<name>_Cheat_Sheet.html on 2026-10-07,
# under the title its page gives.
