# Each checklist item's references in the client's report (design § 10). A finding's own CWE, when
# the agent names one, takes the place of the item's; the OWASP Top 10:2025 category follows from
# the CWE through top10-2025.yaml. The report links, never quotes, and says "relevant to", never
# "compliant".
